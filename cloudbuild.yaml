steps:
  - name: 'python:3.12-slim'
    entrypoint: pip
    args: ['install', '-r', 'requirements.txt', '--break-system-packages']

  - name: 'python:3.12-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "$$SA_KEY" > /tmp/sa-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 8
        pytest tests/test_isolation.py -v
    secretEnv: ['SA_KEY']

availableSecrets:
  secretManager:
    - versionName: projects/regulator-dev/secrets/regulator-dev-sa-key/versions/latest
      env: 'SA_KEY'